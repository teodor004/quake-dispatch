name: Deploy

# La merge pe main: CI -> Terraform (backend + infrastructura) -> dashboard pe S3/CloudFront.
# Acces AWS prin OIDC (fara chei statice). Necesita in GitHub:
#   Secrets:   AWS_ROLE_ARN      (output deploy_role_arn din infrastructure/bootstrap)
#   Secrets:   ALERT_EMAIL       (optional: adresa abonata la alertele SNS; date personale -> nu in repo)
#   Variables: TF_STATE_BUCKET   (output state_bucket din infrastructure/bootstrap)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un singur deploy odata; nu oprim un terraform apply la jumatate.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  TF_VERSION: 1.9.8

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  infra:
    name: Terraform apply
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # pentru OIDC
    defaults:
      run:
        working-directory: infrastructure
    env:
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      TF_VAR_ingest_api_key: ${{ secrets.INGEST_API_KEY }}
      TF_VAR_dispatch_provider: ${{ vars.DISPATCH_PROVIDER || 'twilio' }}
      TF_VAR_dispatch_to_number: ${{ secrets.DISPATCH_TO_NUMBER }}
      TF_VAR_dispatch_from_number: ${{ secrets.DISPATCH_FROM_NUMBER }}
      TF_VAR_twilio_account_sid: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TF_VAR_twilio_auth_token: ${{ secrets.TWILIO_AUTH_TOKEN }}
    outputs:
      api_url: ${{ steps.out.outputs.api_url }}
      dashboard_bucket: ${{ steps.out.outputs.dashboard_bucket }}
      distribution_id: ${{ steps.out.outputs.distribution_id }}
      dashboard_url: ${{ steps.out.outputs.dashboard_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: false # numele bucket-urilor contin account id-ul si trebuie transmise intre job-uri

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Init
        run: terraform init -input=false -backend-config=backend.hcl -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Plan
        run: terraform plan -input=false -out=tfplan

      - name: Apply
        run: terraform apply -input=false tfplan

      - name: Outputs
        id: out
        run: |
          {
            echo "api_url=$(terraform output -raw api_url)"
            echo "dashboard_bucket=$(terraform output -raw dashboard_bucket)"
            echo "distribution_id=$(terraform output -raw dashboard_distribution_id)"
            echo "dashboard_url=$(terraform output -raw dashboard_url)"
          } >> "$GITHUB_OUTPUT"

  dashboard:
    name: Deploy dashboard
    needs: infra
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # Fara "environment:": un job legat de un environment primeste alt sub OIDC
    # (repo:...:environment:<nume>), pe care rolul de deploy nu il accepta.
    defaults:
      run:
        working-directory: src/web/quake-dispatch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/quake-dispatch/package-lock.json

      - name: Build
        env:
          VITE_EVENTS_URL: ${{ needs.infra.outputs.api_url }}/events
        run: |
          npm ci
          npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        env:
          BUCKET: ${{ needs.infra.outputs.dashboard_bucket }}
        run: |
          # fisierele din assets/ au hash in nume -> cache lung; index.html -> mereu proaspat
          aws s3 sync dist "s3://$BUCKET" --delete --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ needs.infra.outputs.distribution_id }}" --paths "/index.html" "/"

      - name: Post-deploy smoke test
        env:
          API_URL: ${{ needs.infra.outputs.api_url }}
          DASHBOARD_URL: ${{ needs.infra.outputs.dashboard_url }}
        run: |
          curl -fsS "$API_URL/events" | head -c 200 && echo ""
          curl -fsS "$API_URL/devices" | head -c 200 && echo ""
          curl -fsS "$API_URL/alerts" | head -c 200 && echo ""
          curl -fsSI "$DASHBOARD_URL" | head -n 5

      - name: Summary
        run: |
          echo "Dashboard: ${{ needs.infra.outputs.dashboard_url }}" >> "$GITHUB_STEP_SUMMARY"
